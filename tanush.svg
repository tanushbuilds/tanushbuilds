<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#a5d6ff"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="180" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#161b22" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="180" stroke="#161b22" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="180" stroke="#161b22" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="180" stroke="#161b22" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="180" stroke="#161b22" stroke-width="1"/>

  <!-- Accent line top -->
  <line x1="0" y1="3" x2="800" y2="3" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>

  <!-- Accent line bottom -->
  <line x1="0" y1="177" x2="800" y2="177" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>

  <!-- Glow dots -->
  <circle cx="60" cy="90" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="740" cy="90" r="3" fill="#58a6ff" opacity="0.4"/>

  <!-- Main name -->
  <text
    x="400"
    y="105"
    font-family="'Space Mono', 'Courier New', monospace"
    font-size="72"
    font-weight="700"
    fill="url(#textGrad)"
    filter="url(#glow)"
    text-anchor="middle"
    letter-spacing="18"
  >TANUSH</text>

  <!-- Subtitle -->
  <text
    x="400"
    y="145"
    font-family="'Space Mono', 'Courier New', monospace"
    font-size="13"
    fill="#8b949e"
    text-anchor="middle"
    letter-spacing="5"
  >AI · GAMES · 14 Y/O BUILDER</text>

</svg>
